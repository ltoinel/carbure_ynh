# Settings of Carbure that nginx only accepts outside a server (http level): installed as
# /etc/nginx/conf.d/__APP__-http.conf, besides conf/nginx.conf of the domain.

# Rate limit of the login routes (POST /api/user/login, /api/user/login/mfa,
# /api/oauth/token): 30 requests per minute per client address, besides the lock of an
# account after 5 failed logins, which does not slow down attempts spread over many
# accounts. As docker/nginx.conf of Carbure; nginx of YunoHost faces the clients, their
# address is the one of the connection.
limit_req_zone $binary_remote_addr zone=__APP___login:10m rate=30r/m;
