# Carbure on its own domain: the portal, Swagger UI and the API; the rest of the sources,
# the configuration and the data are never served (they are outside these locations).
# Port of docker/nginx.conf of Carbure.

location = / {
  return 302 /portal/;
}

location /portal/ {
  alias __INSTALL_DIR__/portal/;
  try_files $uri $uri/ =404;

  more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
  more_set_headers "X-Content-Type-Options: nosniff";
  more_set_headers "X-Frame-Options: DENY";
  more_set_headers "Referrer-Policy: no-referrer";
  more_set_headers "Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=(), usb=()";
  more_set_headers "Cross-Origin-Opener-Policy: same-origin";

  location ~ \.webmanifest$ {
    types { application/manifest+json webmanifest; }
  }
}

# The only PHP script of Swagger UI: the OpenAPI document of the API
location = /swagger/swagger.php {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME __INSTALL_DIR__/swagger/swagger.php;
  fastcgi_param SCRIPT_NAME /swagger/swagger.php;
  fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
}

location /swagger/ {
  alias __INSTALL_DIR__/swagger/;
  try_files $uri $uri/ =404;
  more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
  more_set_headers "X-Content-Type-Options: nosniff";
  more_set_headers "X-Frame-Options: SAMEORIGIN";
  more_set_headers "Referrer-Policy: no-referrer";
}

# OAuth metadata of the MCP server (AI agents such as Claude), answered by the API
location ^~ /.well-known/oauth- {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME __INSTALL_DIR__/src/api.php;
  fastcgi_param SCRIPT_NAME /src/api.php;
  fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
}

location /api/ {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME __INSTALL_DIR__/src/api.php;
  fastcgi_param SCRIPT_NAME /src/api.php;
  fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
  client_max_body_size 2m;
  # The synchronization is long and streamed (Server-Sent Events)
  fastcgi_read_timeout 3600s;
  fastcgi_buffering off;
  gzip off;
}

# Import of a backup (Administration > Backup): larger than the other requests
location = /api/backup/import {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME __INSTALL_DIR__/src/api.php;
  fastcgi_param SCRIPT_NAME /src/api.php;
  fastcgi_pass unix:/var/run/php/php__PHP_VERSION__-fpm-__APP__.sock;
  client_max_body_size 32m;
  fastcgi_read_timeout 600s;
  gzip off;
}
