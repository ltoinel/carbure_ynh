; Settings of docker/php.ini of Carbure
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
; The synchronization streams its progress (Server-Sent Events): nothing buffered
php_admin_value[output_buffering] = 0
php_admin_flag[zlib.output_compression] = off
; Long bank synchronizations: limited by nginx (fastcgi_read_timeout)
php_admin_value[max_execution_time] = 0
php_admin_flag[zend.exception_ignore_args] = on
; Unused by Carbure, and an exploitation path of PHP2Shell (CVE-2026-109618)
php_admin_flag[session.upload_progress.enabled] = off
